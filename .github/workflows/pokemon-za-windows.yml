name: Pokemon ZA - Lichii build 160 Windows
on:
  push:
    branches:
      - pokemon-za-fix-build160
    paths:
      - src/video_core/shader_environment.cpp
      - .github/workflows/pokemon-za-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Compile Lichii 160 + Pokemon Z-A fix
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    steps:
      - name: Check out build 160 with patch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify patch is present
        shell: pwsh
        run: |
          if (-not (Select-String -Path src/video_core/shader_environment.cpp -Pattern 'NULL_TEXTURE_2D_KEY' -Quiet)) {
            throw 'Pokemon Z-A patch is missing'
          }
          Write-Host 'Pokemon Z-A fix #1443 is present'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools
        shell: pwsh
        run: glslangValidator --version

      - name: Configure Windows release
        run: |
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DLICHII_BUILD_TAG=za-fix-160 \
            -DLICHII_BUILD_PLATFORM=windows-x86_64 \
            -DUSE_DISCORD_PRESENCE=OFF \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Build Lichii
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel

      - name: Package Windows executable
        shell: pwsh
        run: |
          if (-not (Test-Path build/release/bin/lichii.exe)) { throw 'lichii.exe missing' }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          Get-ChildItem build/release/bin | Select-Object Name,Length

      - name: Upload patched Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-160-Pokemon-ZA-Fix-Windows
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7
